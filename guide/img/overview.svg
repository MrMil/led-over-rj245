<text x="816" y="176" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" font-weight="normal" fill="#222">WiFi access point from the controller.</text>
<text x="816" y="195" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" font-weight="normal" fill="#222">Phones connect to it to run the show.</text>
<text x="816" y="214" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" font-weight="normal" fill="#222">No internet needed.</text>
<polyline points="800,196 650,236" fill="none" stroke="#2e7d32" stroke-width="2" stroke-linejoin="round"/>
<rect x="60" y="790" width="1080" height="120" rx="8" fill="#fafafa" stroke="#bbb" stroke-width="1"/>
<text x="80" y="818" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="start" font-weight="normal" fill="#222">Purple = 10 m CAT5e patch lead, buried in a trench. Carries LED data + ground only. NOT Ethernet.</text>
<text x="80" y="838" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="start" font-weight="normal" fill="#222">Mains cords are buried in the same trenches. No cable above ground: boxes sit inside the bases.</text>
<text x="80" y="858" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="start" font-weight="normal" fill="#222">Wave order around the circle: statue 0 → 1 → 2 → 3 (clockwise in this drawing).</text>
<text x="80" y="878" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="start" font-weight="normal" fill="#222">Which physical statue is 0–3 is set at install: label boxes and cables to match.</text>
</svg>
