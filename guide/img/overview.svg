<text x="40" y="50" font-family="Helvetica, Arial, sans-serif" font-size="28" text-anchor="start" font-weight="bold" fill="#222">System overview — top view</text>
<text x="40" y="82" font-family="Helvetica, Arial, sans-serif" font-size="16" text-anchor="start" font-weight="normal" fill="#444">One controller (statue 0) drives all four statues.</text>
<text x="40" y="104" font-family="Helvetica, Arial, sans-serif" font-size="16" text-anchor="start" font-weight="normal" fill="#444">Only data crosses the ground; each statue has its own mains-powered PSU.</text>
