<polyline points="1000,170 1000,440" fill="none" stroke="#7b1fa2" stroke-width="3" stroke-linejoin="round"/>
<circle cx="1000" cy="397" r="5" fill="#7b1fa2"/>
<polyline points="1000,170 1100,170" fill="none" stroke="#7b1fa2" stroke-width="3" stroke-linejoin="round"/>
<rect x="1100" y="142" width="360" height="56" rx="8" fill="#fff8e1" stroke="#b58900" stroke-width="2"/>
<circle cx="1100" cy="170" r="4.5" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="1114" y="164" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="start" font-weight="bold" fill="#222">JST-SM out · face 1 strand</text>
<text x="1114" y="184" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#555">DATA here · 5V/GND from the joints</text>
