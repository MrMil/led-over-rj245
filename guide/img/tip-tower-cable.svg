<circle cx="1100" cy="260" r="4.5" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="1114" y="254" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="start" font-weight="bold" fill="#222">JST-SM out · face 2 strand</text>
<text x="1114" y="274" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#555">DATA here · 5V/GND from the joints</text>
<polyline points="1000,350 1100,350" fill="none" stroke="#7b1fa2" stroke-width="3" stroke-linejoin="round"/>
<rect x="1100" y="322" width="360" height="56" rx="8" fill="#fff8e1" stroke="#b58900" stroke-width="2"/>
<circle cx="1100" cy="350" r="4.5" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="1114" y="344" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="start" font-weight="bold" fill="#222">JST-SM out · face 3 strand</text>
<text x="1114" y="364" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#555">DATA here · 5V/GND from the joints</text>
<polyline points="1000,440 1100,440" fill="none" stroke="#7b1fa2" stroke-width="3" stroke-linejoin="round"/>
<rect x="1100" y="412" width="360" height="56" rx="8" fill="#fff8e1" stroke="#b58900" stroke-width="2"/>
<circle cx="1100" cy="440" r="4.5" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="1114" y="434" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="start" font-weight="bold" fill="#222">JST-SM out · face 4 strand</text>
<text x="1114" y="454" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="normal" fill="#555">DATA here · 5V/GND from the joints</text>
<polyline points="920,220 970,220" fill="none" stroke="#d32f2f" stroke-width="3" stroke-linejoin="round"/>
<polygon points="970,220 980,208 1023,208 1023,232 980,232" fill="#fde3e3" stroke="#d32f2f" stroke-width="1.5"/>
<text x="1001.5" y="225" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#d32f2f">+5V</text>
<polyline points="920,280 970,280" fill="none" stroke="#1f5fbf" stroke-width="3" stroke-linejoin="round"/>
<polygon points="970,280 980,268 1023,268 1023,292 980,292" fill="#e6e6e6" stroke="#222222" stroke-width="1.5"/>
<text x="1001.5" y="285" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="#222222">GND</text>
<text x="40" y="520" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" font-weight="normal" fill="#333">Tower end, made up on the bench: the cable's +5V core, GND core and the data GND meet the 4 JST-SM pigtails in two soldered joints;</text>
<text x="40" y="539" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" font-weight="normal" fill="#333">the DATA wire is soldered to the 4 DATA pigtails. Heat shrink over every joint. The 4 faces share one buffered data line from the</text>
<text x="40" y="558" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" font-weight="normal" fill="#333">power box, so a short on one face's data lead darkens all 4. 22 AWG pigtails are fine over &lt; 0.5 m.</text>
</svg>
