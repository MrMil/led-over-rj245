<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="640" viewBox="0 0 1500 640">
<title>Tip-tower cable (power box in T2 → T1, in T6 → T7)</title>
<desc>Tip-tower cable: XT60 and data pair at the power box, split by soldered joints to four JST-SM strands at the tower. Generated by tools/wiring_diagrams.py; do not edit.</desc>
<rect x="0" y="0" width="1500" height="640" rx="0" fill="#ffffff" stroke="none" stroke-width="2"/>
<text x="40" y="50" font-family="Helvetica, Arial, sans-serif" font-size="28" text-anchor="start" font-weight="bold" fill="#222">Tip-tower cable — power box in T2 → T1, power box in T6 → T7</text>
<text x="40" y="82" font-family="Helvetica, Arial, sans-serif" font-size="16" text-anchor="start" font-weight="normal" fill="#444">One made-up cable: XT60 and the data pair at the box end, 4 JST-SM at the tower end. T1 and T7 have nothing else:</text>
<text x="40" y="104" font-family="Helvetica, Arial, sans-serif" font-size="16" text-anchor="start" font-weight="normal" fill="#444">no box, no base wiring. The cable surfaces inside the 15 cm dark space at the bottom of the tower.</text>
<rect x="40" y="180" width="280" height="110" rx="8" fill="#fde3e3" stroke="#d32f2f" stroke-width="2"/>
<text x="56" y="210" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="start" font-weight="bold" fill="#d32f2f">XT60 · into the box's XT60 out</text>
<text x="56" y="230" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="start" font-weight="bold" fill="#d32f2f">+5V (brown)</text>
<text x="56" y="250" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="start" font-weight="bold" fill="#d32f2f">GND (blue)</text>
<circle cx="320" cy="237" r="4.5" fill="#fff" stroke="#333" stroke-width="2"/>
<circle cx="320" cy="262" r="4.5" fill="#fff" stroke="#333" stroke-width="2"/>
<rect x="40" y="340" width="280" height="110" rx="8" fill="#fff8e1" stroke="#b58900" stroke-width="2"/>
<text x="56" y="370" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="start" font-weight="bold" fill="#222">Data · from the box's data out</text>
<text x="56" y="390" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="start" font-weight="bold" fill="#222">DATA</text>
<text x="56" y="410" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="start" font-weight="bold" fill="#222">GND</text>
<circle cx="320" cy="397" r="4.5" fill="#fff" stroke="#333" stroke-width="2"/>
<circle cx="320" cy="422" r="4.5" fill="#fff" stroke="#333" stroke-width="2"/>
<rect x="380" y="150" width="300" height="320" rx="8" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5"/>
<text x="530" y="176" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#555">buried</text>
<text x="530" y="192" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#555">3 × 2.5 (+5V, GND) + 22 AWG pair (DATA, GND)</text>
<text x="530" y="208" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#555">taped together · T2 → T1 1.2 m, T6 → T7 1.0 m</text>
<polyline points="320,237 760,237 760,220 800,220" fill="none" stroke="#d32f2f" stroke-width="5" stroke-linejoin="round"/>
<polyline points="320,262 760,262 760,280 800,280" fill="none" stroke="#1f5fbf" stroke-width="5" stroke-linejoin="round"/>
<polyline points="320,422 780,422 780,300" fill="none" stroke="#222222" stroke-width="2" stroke-linejoin="round"/>
<circle cx="780" cy="300" r="5" fill="#222222"/>
<polyline points="780,300 800,300" fill="none" stroke="#222222" stroke-width="2" stroke-linejoin="round"/>
<text x="690" y="440" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="start" font-weight="normal" fill="#555">data GND joins GND</text>
<rect x="800" y="200" width="120" height="40" rx="8" fill="#fff" stroke="#d32f2f" stroke-width="2"/>
<text x="860" y="226" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="bold" fill="#d32f2f">solder +5V</text>
