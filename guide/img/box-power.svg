<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="720" viewBox="0 0 1560 720">
<title>Box power wiring (all four boxes)</title>
<desc>Mains inlet, PSU terminals and 5 V distribution to the LED exits and perfboard. Generated by tools/wiring_diagrams.py; do not edit.</desc>
<rect x="0" y="0" width="1560" height="720" rx="0" fill="#ffffff" stroke="none" stroke-width="2"/>
<text x="40" y="50" font-family="Helvetica, Arial, sans-serif" font-size="28" text-anchor="start" font-weight="bold" fill="#222">Power — the same in all four boxes</text>
<text x="40" y="82" font-family="Helvetica, Arial, sans-serif" font-size="16" text-anchor="start" font-weight="normal" fill="#444">Mains to the PSU; strip power straight from the PSU, never through the perfboard.</text>
<text x="40" y="104" font-family="Helvetica, Arial, sans-serif" font-size="16" text-anchor="start" font-weight="normal" fill="#444">Perfboard (+5V / GND rails) gets its own pair from the PSU's second +V / −V terminals.</text>
