<text x="1000" y="380" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" font-weight="normal" fill="#333">Each JST-SM exit carries at most 3 A.</text>
<text x="1000" y="399" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" font-weight="normal" fill="#333">These four exits are the statue's only power;</text>
<text x="1000" y="418" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" font-weight="normal" fill="#333">the controller's brightness limit keeps each under 3 A.</text>
<text x="1000" y="437" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" font-weight="normal" fill="#333">Data wire: from the perfboard, see the</text>
<text x="1000" y="456" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" font-weight="normal" fill="#333">box's signal diagram.</text>
<text x="200" y="620" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="start" font-weight="normal" fill="#c62828">Mains wiring is done in the workshop and checked before the event. In the field, never open a box</text>
<text x="200" y="640" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="start" font-weight="normal" fill="#c62828">while its C14 cord is plugged in. JST pigtail colours vary by supplier — check 5V / DATA / GND with a meter.</text>
